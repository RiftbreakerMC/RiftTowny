name: RiftTowny
version: '${project.version}'
main: net.riftbreaker.rifttowny.paper.RiftTownyPlugin
api-version: '26.2'
folia-supported: true
description: Town, nation, territory, economy, governance and war platform.
authors: [RiftbreakerMC]
website: https://github.com/RiftbreakerMC/RiftTowny

# Every integration is optional. One missing plugin disables only what depends on it.
# Towny is deliberately NOT listed: RiftTowny refuses to start when it is present, because the
# command tree and the %townyadvanced_*% placeholder namespace both collide.
softdepend:
  - RiftCore
  - RiftEco
  - RiftLogger
  - RiftPvP
  - RiftBoosters
  - RiftChat
  - RiftShop
  - RiftSpawners
  - RiftEvents
  - RiftEssentials
  - VelocitySrv
  - PlaceholderAPI
  - LuckPerms
  - CoreProtect
  - floodgate
  - Geyser-Spigot
  - BlueMap
  - dynmap
  - squaremap
  - mcMMO
  - VaultUnlocked

commands:
  rifttowny:
    description: RiftTowny administration and diagnostics.
    usage: /rifttowny <status|help>
    permission: rifttowny.admin
  town:
    aliases: [t]
    description: Found and manage a town.
    usage: /town <new|info|add|kick|leave|rename|mayor|delete|role>

permissions:
  rifttowny.admin:
    description: RiftTowny administration.
    default: op
    children:
      rifttowny.admin.status: true
  rifttowny.admin.status:
    description: View platform, storage, outbox and integration state.
    default: op

  # Granted to everyone: these are the commands a town is played through, and the services
  # themselves check who may actually do what. A permission node here only decides whether the
  # subcommand is offered at all.
  rifttowny.town:
    description: Use the town commands.
    default: true
    children:
      rifttowny.town.new: true
      rifttowny.town.info: true
      rifttowny.town.add: true
      rifttowny.town.kick: true
      rifttowny.town.leave: true
      rifttowny.town.rename: true
      rifttowny.town.mayor: true
      rifttowny.town.delete: true
      rifttowny.role.view: true
      rifttowny.role.manage: true
      rifttowny.role.assign: true
  rifttowny.town.new:
    description: Found a town.
    default: true
  rifttowny.town.info:
    description: View a town.
    default: true
  rifttowny.town.add:
    description: Add a resident to your town.
    default: true
  rifttowny.town.kick:
    description: Remove a resident from your town.
    default: true
  rifttowny.town.leave:
    description: Leave your town.
    default: true
  rifttowny.town.rename:
    description: Rename your town.
    default: true
  rifttowny.town.mayor:
    description: Hand over the mayoralty.
    default: true
  rifttowny.town.delete:
    description: Disband your town.
    default: true
  rifttowny.role.view:
    description: View your town's roles.
    default: true
  rifttowny.role.manage:
    description: Create, edit and delete your town's roles.
    default: true
  rifttowny.role.assign:
    description: Give and take your town's roles.
    default: true
