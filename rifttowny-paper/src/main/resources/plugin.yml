name: RiftTowny
version: '${project.version}'
main: net.riftbreaker.rifttowny.paper.RiftTownyPlugin
api-version: '26.2'
folia-supported: true
description: Town, nation, territory, economy, governance and war platform.
authors: [RiftbreakerMC]
website: https://github.com/RiftbreakerMC/RiftTowny

# Every integration is optional. One missing plugin disables only what depends on it.
# Towny is deliberately NOT listed: RiftTowny refuses to start when it is present, because the
# command tree and the %townyadvanced_*% placeholder namespace both collide.
softdepend:
  - RiftCore
  - RiftEco
  - RiftLogger
  - RiftPvP
  - RiftBoosters
  - RiftChat
  - RiftShop
  - RiftSpawners
  - RiftEvents
  - RiftEssentials
  - VelocitySrv
  - PlaceholderAPI
  - LuckPerms
  - floodgate
  - Geyser-Spigot
  - BlueMap
  - dynmap
  - squaremap
  - mcMMO
  - VaultUnlocked

commands:
  rifttowny:
    description: RiftTowny administration and diagnostics.
    usage: /rifttowny <status|migrate|flag|help>
    permission: rifttowny.admin
  town:
    aliases: [t]
    description: Found and manage a town.
    usage: /town <new|info|list|online|purge|merge|trust|outlaw|map|bank|deposit|withdraw|add|uninvite|invites|accept|deny|kick|leave|rename|mayor|claim|unclaim|preview|homeblock|spawn|setspawn|reclaim|delete|role|flag>
  resident:
    aliases: [res]
    description: Look at a player's town record.
    usage: /resident <list|set|[player]>
  townchat:
    aliases: [tc]
    description: Speak to your town, or switch to its channel.
    usage: /tc [message]
  nationchat:
    aliases: [nc]
    description: Speak to your nation, or switch to its channel.
    usage: /nc [message]
  allychat:
    aliases: [ac]
    description: Speak to your nation and its allies, or switch to that channel.
    usage: /ac [message]
  plot:
    aliases: [p]
    description: Take and manage the plot you are standing on.
    usage: /plot <info|claim|unclaim|set|list>
  nation:
    aliases: [n]
    description: Found and manage a nation.
    usage: /nation <new|info|list|online|bank|invite|withdraw|invites|join|leave|expel|capital|king|rename|delete>

permissions:
  rifttowny.admin:
    description: RiftTowny administration.
    default: op
    children:
      rifttowny.admin.status: true
      rifttowny.admin.migrate: true
      rifttowny.admin.flag: true
  rifttowny.admin.status:
    description: View platform, storage, outbox and integration state.
    default: op

  # Importing another plugin's world. op-only and separate from .status, because this is the one
  # irreversible bulk operation in the plugin - it can create hundreds of towns in one command.
  rifttowny.admin.migrate:
    description: Import an existing Towny database.
    default: op

  # The two flag layers no town can reach. The ADMIN layer is resolved first and beats every town's
  # own setting, so this is the node that decides who may forbid something server-wide - a different
  # question from who may read diagnostics, and it keeps its own node for that reason.
  rifttowny.admin.flag:
    description: Set the server-wide and per-world protection layers.
    default: op

  # Deliberately not a child of rifttowny.admin. Ignoring every claim on the server is a distinct
  # decision from being able to read diagnostics, and bundling the two would hand it out by
  # accident to every role a server gives its moderators.
  rifttowny.bypass:
    description: Ignore town protection entirely.
    default: op

  # Granted to everyone: these are the commands a town is played through, and the services
  # themselves check who may actually do what. A permission node here only decides whether the
  # subcommand is offered at all.
  rifttowny.town:
    description: Use the town commands.
    default: true
    children:
      rifttowny.town.new: true
      rifttowny.town.info: true
      rifttowny.town.add: true
      rifttowny.town.invites: true
      rifttowny.town.kick: true
      rifttowny.town.leave: true
      rifttowny.town.rename: true
      rifttowny.town.mayor: true
      rifttowny.town.delete: true
      rifttowny.town.claim: true
      rifttowny.town.unclaim: true
      rifttowny.town.homeblock: true
      rifttowny.town.bank: true
      rifttowny.town.spawn: true
      rifttowny.town.setspawn: true
      rifttowny.town.reclaim: true
      rifttowny.town.flag: true
      rifttowny.town.outlaw: true
      rifttowny.town.trust: true
      rifttowny.town.merge: true
      rifttowny.town.set: true
      rifttowny.town.tax: true
      rifttowny.role.view: true
      rifttowny.role.manage: true
      rifttowny.role.assign: true
  rifttowny.town.new:
    description: Found a town.
    default: true
  rifttowny.town.info:
    description: View a town, list every town, see who is online in one, and draw the map.
    default: true

  # Looking at somebody's town record. Separate from rifttowny.town.info because it is about a
  # person rather than a place, and a server that wants to hide one may not want to hide the other.
  rifttowny.resident.info:
    description: View a player's town record, and list everybody who belongs to a town.
    default: true

  # A player's own screen, not somebody else's record. Split from .info for the reason that node
  # was split from .town.info: one is about looking at other people, the other is about yourself.
  rifttowny.resident.set:
    description: Change what you see - territory notices, and anything else settable per player.
    default: true

  # Speaking to your own town or nation. Granted to everyone: the channel a player reaches is the
  # one they are a member of, and membership is the check that matters. A server that wants to take
  # a channel away from somebody has LuckPerms and this node.
  rifttowny.chat.town:
    description: Speak to your town's channel.
    default: true
  rifttowny.chat.nation:
    description: Speak to your nation's channel.
    default: true
  rifttowny.chat.ally:
    description: Speak to your nation's allies. The CHAT_ALLY role permission decides who really can.
    default: true
  rifttowny.town.add:
    description: Invite a player to your town, and withdraw the invitation.
    default: true
  rifttowny.town.invites:
    description: See, accept and decline invitations addressed to you.
    default: true
  rifttowny.town.kick:
    description: Remove a resident from your town.
    default: true
  rifttowny.town.leave:
    description: Leave your town.
    default: true
  rifttowny.town.rename:
    description: Rename your town.
    default: true
  rifttowny.town.mayor:
    description: Hand over the mayoralty.
    default: true
  rifttowny.town.delete:
    description: Disband your town.
    default: true
  rifttowny.town.claim:
    description: Claim land for your town.
    default: true
  rifttowny.town.unclaim:
    description: Release your town's land.
    default: true
  rifttowny.town.homeblock:
    description: Move your town's home chunk.
    default: true
  rifttowny.town.bank:
    description: See the treasury, deposit and withdraw. BANK_DEPOSIT and BANK_WITHDRAW decide who really can.
    default: true
  rifttowny.town.spawn:
    description: Travel to your town's spawn. The TOWN_SPAWN role permission decides who really can.
    default: true
  rifttowny.town.setspawn:
    description: Set and remove your town's spawn. The SET_SPAWN role permission decides who really can.
    default: true
  rifttowny.town.reclaim:
    description: Found a town on the ruins of a fallen one.
    default: true
  rifttowny.town.merge:
    description: Absorb another town, or accept being absorbed. Only a mayor can, on either side.
    default: true
  rifttowny.town.trust:
    description: Trust an outsider in your town, and take it back. The MANAGE_TRUST role permission decides who really can.
    default: true
  rifttowny.town.outlaw:
    description: Declare a player unwelcome in your town, and take it back. The MANAGE_TRUST role permission decides who really can.
    default: true
  rifttowny.town.flag:
    description: Change what your town allows. The MANAGE_FLAGS role permission decides who really can.
    default: true
  rifttowny.town.set:
    description: Set your town's board, tag, map colour, openness and neutrality. The MANAGE_SETTINGS role permission decides who really can.
    default: true
  rifttowny.town.tax:
    description: Set what your town charges its own residents. The MANAGE_TAXES role permission decides who really can.
    default: true
  rifttowny.role.view:
    description: View your town's roles.
    default: true
  rifttowny.role.manage:
    description: Create, edit and delete your town's roles.
    default: true
  rifttowny.role.assign:
    description: Give and take your town's roles.
    default: true

  # Same shape again. MANAGE_PLOTS decides who may touch somebody else's plot; holding your own is
  # a right of membership rather than a permission.
  rifttowny.plot:
    description: Use the plot commands.
    default: true
    children:
      rifttowny.plot.info: true
      rifttowny.plot.claim: true
      rifttowny.plot.set: true
  rifttowny.plot.info:
    description: Look at a plot, and list the ones you hold.
    default: true
  rifttowny.plot.claim:
    description: Take and give back plots in your own town.
    default: true
  rifttowny.plot.set:
    description: Say what a plot is for. The MANAGE_PLOTS role permission covers other people's.
    default: true

  # Same shape as the town nodes: granted to everyone, with the nation's own role book deciding who
  # can actually do what. A node here only decides whether the subcommand is offered.
  rifttowny.nation:
    description: Use the nation commands.
    default: true
    children:
      rifttowny.nation.new: true
      rifttowny.nation.info: true
      rifttowny.nation.invite: true
      rifttowny.nation.join: true
      rifttowny.nation.leave: true
      rifttowny.nation.expel: true
      rifttowny.nation.capital: true
      rifttowny.nation.king: true
      rifttowny.nation.rename: true
      rifttowny.nation.delete: true
      rifttowny.nation.set: true
      rifttowny.nation.diplomacy: true
      rifttowny.nation.bank: true
      rifttowny.nation.role.view: true
      rifttowny.nation.role.manage: true
      rifttowny.nation.role.assign: true
  rifttowny.nation.new:
    description: Found a nation.
    default: true
  rifttowny.nation.info:
    description: View a nation, list every nation, and see who is online in one.
    default: true
  rifttowny.nation.invite:
    description: Offer membership to a town, and withdraw the offer.
    default: true
  rifttowny.nation.join:
    description: Accept an invitation on your town's behalf.
    default: true
  rifttowny.nation.leave:
    description: Take your town out of its nation.
    default: true
  rifttowny.nation.expel:
    description: Remove a member town.
    default: true
  rifttowny.nation.capital:
    description: Move the capital.
    default: true
  rifttowny.nation.king:
    description: Hand over the crown.
    default: true
  rifttowny.nation.rename:
    description: Rename your nation.
    default: true
  rifttowny.nation.delete:
    description: Disband your nation.
    default: true
  rifttowny.nation.set:
    description: Set your nation's board, tag, map colour and neutrality. The MANAGE_SETTINGS role permission decides who really can.
    default: true
  rifttowny.nation.bank:
    description: See the nation treasury, deposit and withdraw. BANK_DEPOSIT and BANK_WITHDRAW decide who really can.
    default: true
  rifttowny.nation.diplomacy:
    description: See and change who your nation is allied to and at odds with. The MANAGE_DIPLOMACY role permission decides who really can declare.
    default: true
  rifttowny.nation.role.view:
    description: View your nation's roles.
    default: true
  rifttowny.nation.role.manage:
    description: Create, edit and delete your nation's roles.
    default: true
  rifttowny.nation.role.assign:
    description: Give and take your nation's roles.
    default: true
