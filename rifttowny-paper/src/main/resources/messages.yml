# RiftTowny messages. MiniMessage format: https://docs.advntr.dev/minimessage/format.html
#
# Every key under the sections that MessageKey names has a built-in default. Deleting a key falls
# back to that default rather than printing a blank line, and a template that fails to parse is
# reported once at startup and then falls back too - an operator's typo should cost them their
# customisation, not the message.
#
# The denial and name-problem sections are different: they are keyed by enum constant rather than by
# a named MessageKey, and a test asserts every constant has an entry here. Adding a refusal in code
# without a sentence here fails the build.
#
# Placeholders are written <like_this> and are inserted literally: a town name containing
# MiniMessage tags cannot inject formatting.

prefix: '<gradient:#4ea8de:#80ffdb><bold>RiftTowny</bold></gradient> <dark_gray>|</dark_gray> '

startup:
  towny-conflict: '<red>RiftTowny cannot run alongside Towny: the command tree and the <white>%townyadvanced_*%</white> placeholder namespace both collide. Remove one of the two plugins.</red>'
  storage-problem: '<red><setting></red> <gray><problem></gray> <yellow>-></yellow> <white><remedy></white>'
  storage-abort: '<red>RiftTowny did not start: the storage configuration is unsafe. Fix the problems above and restart.</red>'

command:
  no-permission: '<red>You do not have permission to do that.</red>'
  unknown-subcommand: '<red>Unknown subcommand <white><input></white>. Try <white><command></white>.</red>'
  help-header: '<gray><command></gray>'
  help-line: '  <aqua><usage></aqua> <dark_gray>-</dark_gray> <gray><description></gray>'
  player-only: '<red>Only a player can do that.</red>'
  usage: '<red>Usage: <white><usage></white></red>'
  denied: '<red><reason></red>'
  name-rejected: '<red>That name will not work: <white><problems></white></red>'
  failed: '<red>That did not work. The problem has been logged for an administrator.</red>'

town:
  founded: '<green>Founded <white><town></white>. You are its mayor.</green>'
  joined: '<green><white><resident></white> joined <white><town></white>.</green>'
  left: '<yellow>You left <white><town></white>.</yellow>'
  kicked: '<yellow><white><resident></white> was removed from <white><town></white>.</yellow>'
  renamed: '<green>Renamed to <white><town></white>.</green>'
  mayor-transferred: '<green><white><resident></white> is now the mayor of <white><town></white>.</green>'
  disbanded: '<yellow>Disbanded <white><town></white>.</yellow>'
  not-in-a-town: '<red>You are not in a town.</red>'
  info-header: '<gray>Town <white><town></white></gray>'
  info-line: '  <gray><label></gray> <white><value></white>'
  claimed: '<green>Claimed <white><chunk></white> as <white><kind></white>. Your town now holds <white><total></white> chunk(s).</green>'
  unclaimed: '<yellow>Released <white><chunk></white>.</yellow>'
  homeblock-moved: '<green>Your home chunk is now <white><chunk></white>.</green>'
  claim-preview-ok: '<gray>Claiming <white><chunk></white> would take you from <white><before></white> to <white><after></white> chunk(s).</gray>'
  claim-preview-refused: '<red>Claiming <white><chunk></white> would fail: <white><reason></white></red>'
  console-has-no-chunk: '<red>The console is not standing anywhere.</red>'

role:
  created: '<green>Created the role <white><role></white>.</green>'
  deleted: '<yellow>Deleted the role <white><role></white>.</yellow>'
  assigned: '<green><white><resident></white> now holds <white><role></white>.</green>'
  unassigned: '<yellow><white><resident></white> no longer holds <white><role></white>.</yellow>'
  list-header: '<gray>Roles in <white><town></white>, highest first:</gray>'
  list-line: '  <aqua><role></aqua> <dark_gray>@</dark_gray><gray><priority></gray> <dark_gray>-</dark_gray> <gray><permissions> permission(s)</gray>'

protection:
  denied: '<red>You cannot do that in <white><town></white>.</red>'
  denied-by-role: '<red>Your role in <white><town></white> does not allow that <gray>(<permission>)</gray>.</red>'
  town-not-loaded: '<red>This land is protected, but its town could not be loaded. Please tell an administrator.</red>'

status:
  header: '<gray>RiftTowny <white><version></white></gray>'
  platform: '  <gray>Platform</gray> <white><platform></white> <dark_gray>|</dark_gray> <gray>API</gray> <white><api></white>'
  storage: '  <gray>Storage</gray> <white><backend></white> <dark_gray>|</dark_gray> <gray>schema</gray> <white><schema></white> <dark_gray>|</dark_gray> <gray>topology</gray> <white><topology></white>'
  outbox: '  <gray>Outbox</gray> <white><pending></white> pending, <white><claimed></white> claimed, <white><failed></white> failed'
  outbox-unavailable: '  <gray>Outbox</gray> <red>unavailable: <reason></red>'
  integrations-header: '  <gray>Integrations</gray>'
  integration-active: '    <green><capability></green> <dark_gray>-</dark_gray> <gray><detail></gray>'
  integration-problem: '    <red><capability></red> <white><state></white> <dark_gray>-</dark_gray> <gray><detail></gray>'
  integration-absent: '    <dark_gray><capability> - not installed</dark_gray>'

# One sentence per ChangeDenial constant. Plain text, not MiniMessage: they are inserted into
# command.denied as a literal value so a translator cannot accidentally inject formatting.
