# Importing another plugin's world. See COMPATIBILITY_MATRIX section 5.
migrate:
  not-configured: '<red>No Towny database is configured. Set <white>migration.towny.jdbc-url</white> in config.yml — the credentials go there rather than in this command, so they do not end up in the log.</red>'
  ambiguous: '<red>Both <white>jdbc-url</white> and <white>data-folder</white> are set, and they may hold different data — a server that moved to MySQL still has its old files. Clear whichever one is not the live database.</red>'
  started: '<gray>Reading <white><source></white> (<white><mode></white>)…</gray>'
  read: '<gray>Read <white><summary></white></gray>'
  unreadable: '<red>That database could not be read: <white><reason></white></red>'
  done: '<green><summary></green>'
  problem: '  <yellow><problem></yellow>'
  dry-run: '<gray>Nothing was written. Run <white><command></white> to do it for real — take a backup first, because there is no undo.</gray>'
  failed: '<red>The import stopped part-way. Whatever had already been written is kept, and running it again will resume — the details are in the server log.</red>'

