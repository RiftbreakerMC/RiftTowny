  already-in-this-town: 'Already a resident of that town.'
  not-a-resident-of-this-town: 'That player is not a resident of this town.'
  last-resident-must-disband-instead: 'You are the last resident. Disband the town instead of leaving it.'
  mayor-must-transfer-first: 'The mayor must hand over the mayoralty before leaving.'
  leader-must-be-a-member: 'A leader must already belong to the organisation.'
  already-the-leader: 'They already lead it.'
  town-already-in-another-nation: 'That town already belongs to another nation.'
  town-already-in-this-nation: 'That town is already in this nation.'
  town-not-in-this-nation: 'That town is not in this nation.'
  capital-must-be-a-member-town: 'A capital must be one of the nation''s own towns.'
  capital-must-move-first: 'Move the capital before the capital town leaves.'
  already-the-capital: 'That town is already the capital.'
  cannot-trust-a-resident: 'Residents already have member rights; trust is for outsiders.'
  already-trusted: 'Already trusted.'
  not-trusted: 'Not trusted.'
  role-not-found: 'No such role.'
  role-name-taken: 'Another role already has that name.'
  system-role-cannot-be-deleted: 'The leader, member and visitor roles cannot be deleted.'
  system-role-priority-is-fixed: 'A built-in role cannot be moved in the ranking.'
  leader-permissions-are-fixed: 'The leader role always holds every permission.'
  leader-role-is-not-assignable: 'Leadership is handed over, not assigned as a role.'
  baseline-role-is-not-assignable: 'The member role comes from being a resident.'
  priority-already-used: 'Another role already sits at that rank.'
  priority-reserved-for-leader: 'Nothing may rank at or above the leader.'
  insufficient-role-priority: 'You do not outrank that.'
  missing-permission: 'You do not have permission to do that.'
  cannot-grant-unheld-permission: 'You cannot give a role a permission you do not have yourself.'
  cannot-create-role-above-self: 'You cannot create a role at or above your own rank.'
  permission-locked-by-admin: 'That permission is locked by the server administrator.'
  already-has-role: 'They already hold that role.'
  does-not-have-role: 'They do not hold that role.'
  permission-already-granted: 'That role already has it.'
  permission-not-granted: 'That role does not have it.'
  chunk-already-claimed: 'Your town already owns that chunk.'
  chunk-owned-by-another-town: 'Another town already owns that chunk.'
  chunk-not-claimed: 'Your town does not own that chunk.'
  claim-must-touch-town: 'A claim must border your town. Claim it as an outpost if you meant to settle away from home.'
  outpost-must-not-touch-town: 'That chunk borders your town, so claim it normally rather than as an outpost.'
  unclaim-would-disconnect: 'That would cut your town in two. Unclaim from the edges inwards.'
  homeblock-must-be-unclaimed-last: 'The home chunk is the last one you can release.'
  first-claim-must-be-the-homeblock: 'Your first claim becomes your home chunk.'
  already-the-homeblock: 'That is already your home chunk.'
  name-unchanged: 'That is already the name.'
  name-taken: 'That name is already taken.'
  town-not-found: 'No such town.'
  nation-not-found: 'No such nation.'
  resident-not-found: 'RiftTowny has never seen that player.'

# One sentence per NameProblem constant.
name-problem:
  empty: 'it is empty'
  too-short: 'it is too short'
  too-long: 'it is too long'
  illegal-character: 'it uses a character that is not a letter, digit, hyphen or underscore'
  contains-whitespace: 'it contains a space'
  must-start-with-letter: 'it must start with a letter'
  reserved-word: 'that word is reserved'
