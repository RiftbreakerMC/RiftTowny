# RiftTowny configuration.
#
# Every user-facing string lives in messages.yml, not here.

storage:
  # sqlite  - development and single-server installs only.
  # mariadb - production, and required for any network where several backend servers share data.
  #
  # RiftTowny refuses to start on sqlite when network.shared is true. Two servers writing one
  # SQLite file do not fail loudly; they lose writes, and the symptom appears days later as a town
  # that lost its claims.
  backend: sqlite

  # Below 4 a SQLite pool can deadlock: a repository may open a second connection while still
  # holding the first, and the borrow then blocks until the timeout. A value under 4 is raised
  # automatically and warned about.
  pool-size: 4
  connection-timeout-millis: 5000

  sqlite:
    # Relative to the RiftTowny plugin folder.
    file: rifttowny.db

  mariadb:
    host: 127.0.0.1
    port: 3306
    database: rifttowny
    username: rifttowny
    password: ''

network:
  # Unique and stable per backend server. Outbox ownership, advisory leases and audit rows are all
  # keyed on it, so two servers sharing an id will fight over the same work.
  server-id: standalone

  # True when more than one backend server shares this database. Requires mariadb.
  shared: false

ruins:
  # How long a disbanded town's land stays a ruin before reverting to wilderness.
  #
  # A ruin is what a fallen town leaves behind. It is deliberately NOT protected: the land keeps its
  # buildings but has no owner to object, so it can be looted, burned, blown up and fought over.
  # That is the point - a fallen town is an event for its neighbours, not a sealed monument.
  #
  # An operator who wants it otherwise is not stuck: a ruin's chunks still answer to the admin and
  # world flag layers, so explosions or container access can be shut off server-wide.
  #
  # 0 switches ruins off entirely: a disbanded town's land goes straight back to wilderness. That is
  # different from a very short window, which would leave ruins nobody ever sees.
  lifetime-hours: 72

  # How long a ruin lies open before anybody may rebuild it with /town reclaim.
  #
  # Without a delay a mayor could disband and immediately re-found on the same ground, shedding
  # whatever the town had accumulated - obligations, a reputation, a war - while keeping its land.
  # It is also the interval in which the fallen town's neighbours get to pick it over.
  #
  # Longer than lifetime-hours would be a ruin nobody could ever take on; it is clamped rather than
  # refused, because that is a mistake rather than an intention.
  reclaim-after-hours: 24

  # How often lapsed ruins are swept and their land released. Until the sweep runs, a lapsed ruin's
  # land stays protected and cannot be reclaimed, so this is the delay between "the window closed"
  # and "the land is free", not a correctness setting.
  sweep-minutes: 15

roles:
  # Permissions no configurable role may ever hold, whatever a mayor tries to grant. The leader
  # role is unaffected - it always holds everything - so this bounds delegation, not the mayor.
  #
  # An unknown name here is warned about at startup rather than ignored, because a typo would
  # silently leave a dangerous permission unlocked.
  locked-permissions: []

permissions:
  # Accept towny.* alongside the canonical rifttowny.* nodes. Off by default: silently honouring
  # another plugin's permission nodes is a surprise, and it is only useful while migrating an
  # existing permission set.
  towny-aliases: false
