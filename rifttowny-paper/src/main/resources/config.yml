# RiftTowny configuration.
#
# Every user-facing string lives in messages.yml, not here.

storage:
  # sqlite  - development and single-server installs only.
  # mariadb - production, and required for any network where several backend servers share data.
  #
  # RiftTowny refuses to start on sqlite when network.shared is true. Two servers writing one
  # SQLite file do not fail loudly; they lose writes, and the symptom appears days later as a town
  # that lost its claims.
  backend: sqlite

  # Below 4 a SQLite pool can deadlock: a repository may open a second connection while still
  # holding the first, and the borrow then blocks until the timeout. A value under 4 is raised
  # automatically and warned about.
  pool-size: 4
  connection-timeout-millis: 5000

  sqlite:
    # Relative to the RiftTowny plugin folder.
    file: rifttowny.db

  mariadb:
    host: 127.0.0.1
    port: 3306
    database: rifttowny
    username: rifttowny
    password: ''

network:
  # Unique and stable per backend server. Outbox ownership is keyed on it, so two servers sharing
  # an id would fight over the same work. (Advisory leases and audit rows are named in the design
  # and have no table yet; nothing else reads this today.)
  server-id: standalone

  # True when more than one backend server shares this database. Requires mariadb.
  shared: false

  # How long an undelivered outbox row is kept, in days. Every civic change appends one; the module
  # that delivers them has not shipped, so without this the table grows for ever. 0 keeps them all,
  # which is only sensible once something is actually draining the queue.
  outbox-retention-days: 7

prices:
  # What things cost. Every value is 0 by default, which means free: a server that installs
  # RiftTowny and configures nothing should find claiming works, not find that nobody can afford to.
  #
  # Founding, plots and spawn travel are charged to a player's own wallet and need an economy plugin
  # (RiftEco). Claiming and the refund move money inside the town's own treasury and work without
  # one - a town with an empty treasury simply cannot afford to expand.
  town-founding: 0
  claim: 0

  # Returned to the treasury when a chunk is released. Deliberately its own number rather than a
  # percentage of the claim price: a full refund makes claiming free to experiment with, and a small
  # one makes a misclick expensive, and which of those you want is not something to guess.
  claim-refund: 0

  plot: 0

  # Charged to whoever rebuilds a ruin. The one price with a purpose beyond economy: it is what
  # stops a wealthy player collecting every fallen town on the server.
  reclaim: 0

  # Charged for /town spawn.
  spawn-travel: 0

taxes:
  # Off by default, and deliberately so: a tax run is the one piece of scheduled work in RiftTowny
  # that can take somebody's town away, and it should never start happening because a server
  # upgraded.
  enabled: false

  # How often a run is due. Also the size of the period it claims: several backend servers sharing
  # one database all compute the same period, and exactly one of them runs it.
  interval-hours: 24

  # Charged to each resident's own wallet and paid to their town. Needs an economy plugin.
  #
  # A resident who cannot pay is NOT evicted. Towny evicts them; this does not, because eviction is
  # a punishment applied by a timer to somebody who may simply have been on holiday, and a town that
  # wants somebody gone has /town kick and a person to decide it.
  resident: 0

  # The most a town may charge its own residents through /town set taxes. Setting this to 0 also
  # switches the whole tax run off when the three rates above are 0: permitting towns to charge is
  # itself a reason to run, so a server that wants no tax machinery at all zeroes this too. A town that has set
  # nothing follows `resident` above; one that has set a rate uses its own, up to this ceiling.
  #
  # The ceiling is not optional. The rate is taken automatically from each resident's wallet, once
  # per interval, with no further consent, so a mayor able to set it without limit could empty the
  # pockets of everybody who joined their town with a single command. The server decides how far
  # this can go; the town decides where under it to sit.
  max-resident: 100


  # Charged to the town treasury for every chunk it holds, and it leaves the economy. This is the
  # pressure that stops a town claiming land it has no use for.
  upkeep-per-chunk: 0

  # Charged to each member town's treasury and paid to its nation.
  nation-per-town: 0

  # How long a town may fail to pay before it falls into a ruin. A town that pays is cleared
  # immediately, so missing one run and recovering costs nothing.
  #
  # 0 makes the first missed payment fatal, which is a defensible setting and a brutal one.
  grace-hours: 72

# Importing an existing Towny installation. Used only by /rifttowny migrate; leaving it blank costs
# nothing.
#
# Towny must be STOPPED. RiftTowny refuses to start beside it, so the two are never running at once
# and this reads the database Towny left behind.
#
# The credentials live here rather than being typed into the command, and that is deliberate: a
# password given as a command argument is written to the console log, to any command-logging plugin
# on the server, and to the sender's own client history. Three copies nobody meant to make.
#
# RiftTowny only ever reads this database. An account with SELECT and nothing else is the right one
# to give it.
migration:
  towny:
    # Route one: Towny on MySQL or MariaDB.
    # e.g. jdbc:mariadb://127.0.0.1:3306/towny
    jdbc-url: ''
    username: ''
    password: ''
    # Towny's own default. Its setting is database.sql.table_prefix.
    table-prefix: 'towny_'

    # Route two: Towny on flatfiles, for a server that never moved to a database.
    # Point this at Towny's data folder - the one containing residents/, towns/, nations/ and
    # townblocks/. Usually plugins/Towny/data.
    #
    # Fill in ONE route, not both. A server that migrated from flatfile to MySQL still has the old
    # files on disk, and they are the stale half; picking one silently would import the wrong
    # history and look like it had worked, so configuring both is refused rather than resolved.
    data-folder: ''

# The %townyadvanced_*% placeholder surface, served so a server's existing scoreboards keep working
# unchanged. Requires PlaceholderAPI; without it these settings do nothing and nothing else breaks.
#
# Every placeholder resolves from memory and never from storage, so one on a scoreboard that ticks
# every second costs a map lookup rather than a query.
placeholders:
  # What a yes/no placeholder renders as - %townyadvanced_has_town%, %townyadvanced_is_town_open%
  # and the rest.
  #
  # Configurable because Towny made it configurable, which means a server migrating from it may have
  # scoreboards, Discord embeds and web panels written against words other than these two. Changing
  # them here is cheaper than changing them everywhere else.
  'true': 'true'
  'false': 'false'

  # How %rel_townyadvanced_color% paints one player for another, and what %townyadvanced_rel_color%
  # paints the land you are standing on. Tested narrowest first: your own town, then your nation,
  # then a mutual alliance, then an enmity either side declared, then everybody else.
  #
  # MiniMessage tags, because that is what the rest of this plugin speaks. Hex works too - write
  # '<#a1b2c3>'. A blank entry falls back to the default below rather than colouring nothing.
  relation-colours:
    own: '<green>'
    nation: '<dark_green>'
    ally: '<aqua>'
    enemy: '<red>'
    neutral: '<gray>'

notices:
  # Tell a player whose land they have walked onto, as they cross the border.
  #
  # Without it territory is invisible until it refuses somebody something: a player finds a town by
  # failing to break a block in it, and cannot tell a ruin from a town whose owner is away. Nothing
  # is said while walking inside one town - a town is many chunks, and crossing its middle is not
  # arriving anywhere.
  territory: true

  # Above the hotbar rather than in chat. A border crossing is ambient information, and putting it
  # in chat pushes conversation off the screen on a busy server.
  action-bar: true

spawn:
  # How long a player must stand still before /town spawn moves them.
  #
  # Without it, travelling home is an escape from every fight on the server: a player who can
  # teleport out the moment a fight turns has not lost the fight. The warmup makes it a decision -
  # stand still, in the open, where anybody who objects can do something about it. Moving a whole
  # block cancels it, and so does being hit.
  #
  # 0 teleports immediately, which is worth knowing is a combat decision rather than a convenience
  # one.
  warmup-seconds: 5

  # How long before the same player may travel again. 0 disables it.
  cooldown-seconds: 60

ruins:
  # How long a disbanded town's land stays a ruin before reverting to wilderness.
  #
  # A ruin is what a fallen town leaves behind. It is deliberately NOT protected: the land keeps its
  # buildings but has no owner to object, so it can be looted, burned, blown up and fought over.
  # That is the point - a fallen town is an event for its neighbours, not a sealed monument.
  #
  # An operator who wants it otherwise is not stuck: a ruin's chunks still answer to the admin and
  # world flag layers, so explosions or container access can be shut off server-wide.
  #
  # 0 switches ruins off entirely: a disbanded town's land goes straight back to wilderness. That is
  # different from a very short window, which would leave ruins nobody ever sees.
  lifetime-hours: 72

  # How long a ruin lies open before anybody may rebuild it with /town reclaim.
  #
  # Without a delay a mayor could disband and immediately re-found on the same ground, shedding
  # whatever the town had accumulated - obligations, a reputation, a war - while keeping its land.
  # It is also the interval in which the fallen town's neighbours get to pick it over.
  #
  # Longer than lifetime-hours would be a ruin nobody could ever take on; it is clamped rather than
  # refused, because that is a mistake rather than an intention.
  reclaim-after-hours: 24

  # How often lapsed ruins are swept and their land released. Until the sweep runs, a lapsed ruin's
  # land stays protected and cannot be reclaimed, so this is the delay between "the window closed"
  # and "the land is free", not a correctness setting.
  sweep-minutes: 15

roles:
  # Permissions no configurable role may ever hold, whatever a mayor tries to grant. The leader
  # role is unaffected - it always holds everything - so this bounds delegation, not the mayor.
  #
  # An unknown name here is warned about at startup rather than ignored, because a typo would
  # silently leave a dangerous permission unlocked.
  locked-permissions: []

permissions:
  # Accept towny.* alongside the canonical rifttowny.* nodes. Off by default: silently honouring
  # another plugin's permission nodes is a surprise, and it is only useful while migrating an
  # existing permission set.
  towny-aliases: false
